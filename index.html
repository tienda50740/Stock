<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bata 1 | Stock</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- ZXing para escaneo nativo rápido -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { bata: { red: '#E31E24', dark: '#111827' } }
        }
      }
    }
  </script>

  <style>
    /* Optimización de scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .carrusel-container {
      scroll-snap-type: x mandatory;
      touch-action: pan-x;
    }
    
    /* TRUCO DE VELOCIDAD: El navegador ignora las tarjetas fuera de pantalla */
    .carrusel-card {
      scroll-snap-align: center;
      scroll-snap-stop: always;
      content-visibility: auto;
      contain-intrinsic-size: 300px 400px; 
    }
    
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #0f172a; /* Fondo oscuro base */
    }

    /* ====== FONDO DINÁMICO (Efecto Cristal) ====== */
    #dynamic-bg {
      position: fixed;
      inset: -10%;
      z-index: -1;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.4);
      transition: background-image 0.5s ease-in-out;
      opacity: 0.9;
    }

    /* SPA instantáneo */
    .app-section {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-in-out;
      display: flex;
      flex-direction: column;
      padding-bottom: 65px; 
    }
    .app-section.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    /* ====== ESCÁNER MINIMALISTA ====== */
    #scanner-container {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      display: none;
    }
    #scanner-container.active { display: block; }
    
    #scanner-video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    .scanner-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    /* Marco simple para EAN-13 */
    .scanner-box {
      width: 75%;
      max-width: 280px;
      height: 120px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      box-shadow: 0 0 0 100vmax rgba(0,0,0,0.6);
      position: relative;
    }
    
    /* Láser simple */
    .scanner-box::after {
      content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px;
      background: #E31E24; box-shadow: 0 0 8px #E31E24;
      animation: scan 2s infinite alternate ease-in-out;
    }
    @keyframes scan { 0% { top: 10%; } 100% { top: 90%; } }

    .btn-float {
      width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.5);
      color: white; display: flex; align-items: center; justify-content: center; font-size: 20px;
      border: 1px solid rgba(255,255,255,0.2); transition: transform 0.1s; pointer-events: auto; cursor: pointer;
    }
    .btn-float:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
    .btn-float.active { background: #E31E24; border-color: #E31E24; }
  </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden text-white flex flex-col justify-center items-center antialiased">

  <!-- EL FONDO DINÁMICO (Se actualiza con la imagen del producto) -->
  <div id="dynamic-bg"></div>

  <div class="w-full max-w-md h-full flex flex-col relative overflow-hidden">

    <!-- CONTENEDOR DE VISTAS -->
    <main class="w-full flex-1 relative overflow-hidden">

      <!-- VISTA PRINCIPAL: BUSCADOR -->
      <section id="view-buscar" class="app-section active">
        
        <!-- Header Flotante -->
        <div class="absolute top-0 left-0 w-full p-4 z-40 bg-gradient-to-b from-black/60 to-transparent">
          <div class="flex items-center gap-3">
            <div class="relative flex-1">
              <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input type="text" inputmode="numeric" id="input-busqueda" placeholder="Buscar código..." 
                     class="w-full pl-10 pr-4 py-3 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 text-white placeholder-slate-300 focus:outline-none focus:bg-white/20 font-bold text-sm transition-all"
                     oninput="onBusquedaInput()">
            </div>
            <button onclick="iniciarEscaner()" class="w-12 h-12 shrink-0 rounded-2xl bg-bata-red text-white flex items-center justify-center shadow-lg active:scale-95 transition-transform">
              <i class="fa-solid fa-barcode text-lg"></i>
            </button>
          </div>
          
          <div class="flex justify-between items-center mt-3 px-1 text-[11px] font-bold text-slate-300">
            <span id="txt-posicion">Cargando...</span>
            <button onclick="toggleModoSelectivo()" id="btn-toggle-selectivo" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/10 border border-white/20 backdrop-blur-md">
              <i class="fa-solid fa-pen"></i> <span>Conteo</span>
            </button>
          </div>
        </div>

        <!-- Carrusel de Tarjetas -->
        <div class="w-full h-full pt-28 pb-4">
          <div id="carrusel" class="carrusel-container flex overflow-x-auto no-scrollbar w-full h-full items-center gap-4 px-4"></div>
        </div>
      </section>

      <!-- OTRAS VISTAS (De ejemplo) -->
      <section id="view-movimientos" class="app-section p-6 bg-slate-900/80 backdrop-blur-xl">
        <h2 class="text-2xl font-black mt-10">Movimientos</h2>
      </section>
      <section id="view-reportes" class="app-section p-6 bg-slate-900/80 backdrop-blur-xl">
        <h2 class="text-2xl font-black mt-10">Reportes</h2>
      </section>
      <section id="view-planilla" class="app-section p-6 bg-slate-900/80 backdrop-blur-xl">
        <h2 class="text-2xl font-black mt-10">Planilla</h2>
      </section>
      <section id="view-historial" class="app-section p-6 bg-slate-900/80 backdrop-blur-xl">
        <h2 class="text-2xl font-black mt-10">Historial</h2>
      </section>
    </main>

    <!-- MENÚ INFERIOR (Cristal) -->
    <nav class="absolute bottom-0 w-full bg-slate-900/80 backdrop-blur-lg border-t border-white/10 px-2 py-2 flex items-center justify-around z-40 rounded-t-3xl">
      <button onclick="cambiarSeccion('view-buscar', this, 'Buscar')" class="nav-btn flex flex-col items-center w-14 h-12 rounded-xl text-bata-red">
        <i class="fa-solid fa-magnifying-glass text-lg mb-1"></i><span class="text-[9px] font-bold">Buscar</span>
      </button>
      <button onclick="cambiarSeccion('view-movimientos', this, 'Movs')" class="nav-btn flex flex-col items-center w-14 h-12 rounded-xl text-slate-400">
        <i class="fa-solid fa-boxes-packing text-lg mb-1"></i><span class="text-[9px] font-bold">Movs.</span>
      </button>
      <button onclick="cambiarSeccion('view-reportes', this, 'Reportes')" class="nav-btn flex flex-col items-center w-14 h-12 rounded-xl text-slate-400">
        <i class="fa-solid fa-chart-line text-lg mb-1"></i><span class="text-[9px] font-bold">Reportes</span>
      </button>
      <button onclick="cambiarSeccion('view-planilla', this, 'Planilla')" class="nav-btn flex flex-col items-center w-14 h-12 rounded-xl text-slate-400">
        <i class="fa-solid fa-file-invoice-dollar text-lg mb-1"></i><span class="text-[9px] font-bold">Planilla</span>
      </button>
      <button onclick="cambiarSeccion('view-historial', this, 'Historial')" class="nav-btn flex flex-col items-center w-14 h-12 rounded-xl text-slate-400">
        <i class="fa-solid fa-clock-rotate-left text-lg mb-1"></i><span class="text-[9px] font-bold">Historial</span>
      </button>
    </nav>

    <!-- ================= ESCÁNER MINIMALISTA ================= -->
    <div id="scanner-container">
      <video id="scanner-video" autoplay playsinline muted></video>
      
      <div class="scanner-overlay">
        <!-- Botón Cerrar -->
        <button onclick="detenerEscaner()" class="btn-float absolute top-10 left-6"><i class="fa-solid fa-xmark"></i></button>
        <!-- Botón Linterna -->
        <button onclick="toggleLinterna()" id="btn-linterna" class="btn-float absolute top-10 right-6"><i class="fa-solid fa-bolt"></i></button>

        <!-- Marco de Escaneo -->
        <div class="scanner-box"></div>
        <p class="text-white/80 text-xs font-bold mt-6 tracking-wide">Apunta al código de barras</p>

        <!-- Zoom -->
        <div class="absolute bottom-12 flex items-center gap-6 pointer-events-none">
          <button onclick="ajustarZoom(-0.5)" class="btn-float"><i class="fa-solid fa-minus"></i></button>
          <div class="text-white font-black text-sm bg-black/60 px-4 py-2 rounded-full" id="txt-zoom">1.0x</div>
          <button onclick="ajustarZoom(0.5)" class="btn-float"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-white text-slate-900 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-bold z-[110]">
      <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-500 text-base"></i>
      <span id="toast-msg">Mensaje</span>
    </div>

  </div>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx-pUdg1wOtaxE_V27ZO6-zLAh7lkge8GHKfURNDF_HPim4WGSktwfz4jKyHIEGa81P0A/exec";

    let dbInventario = [];
    let modoActual = 'consulta'; 
    let indiceActual = 0;
    let guardandoBloqueo = false;
    let tiempoDebounce;

    /* ================= VARIABLES DEL ESCÁNER ================= */
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let videoStreamActivo = null;
    let videoTrack = null;
    let linternaEncendida = false;
    let zoomActual = 1.0;
    let escaneandoActivo = false;

    window.onload = function() {
      sincronizarDatos();
      const carrusel = document.getElementById('carrusel');
      carrusel.addEventListener('scroll', () => {
        if (guardandoBloqueo) return;
        const width = carrusel.offsetWidth + 16;
        const nuevoIndice = Math.round(carrusel.scrollLeft / width);
        
        if (nuevoIndice !== indiceActual && dbInventario[nuevoIndice]) {
          indiceActual = nuevoIndice;
          actualizarContadorPosicion();
          
          // ACTUALIZAR FONDO DINÁMICO CON LA IMAGEN DEL PRODUCTO
          const cod = String(obtenerPropiedad(dbInventario[nuevoIndice], ['articulo', 'Articulo'])).trim();
          const urlImagen = `https://intranet.emcomer.pe/INTER/TONW/FotosArticulos/${cod}_1.JPG`;
          document.getElementById('dynamic-bg').style.backgroundImage = `url('${urlImagen}')`;
        }
      });
    };

    /* ================= NAVEGACIÓN ================= */
    function cambiarSeccion(viewId, btn, titulo) {
      document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('text-bata-red'); b.classList.add('text-slate-400');
      });
      if (btn) {
        btn.classList.remove('text-slate-400'); btn.classList.add('text-bata-red');
      }
    }

    /* ================= DATOS ================= */
    function sincronizarDatos() {
      // Si tuvieras un icono de sync, lo girarías aquí
      fetch(`${URL_APPS_SCRIPT}?action=obtenerInventario&t=${Date.now()}`)
        .then(res => res.json())
        .then(data => {
          dbInventario = data;
          renderizarCarrusel();
        })
        .catch(err => mostrarToast("Error de conexión", "error"));
    }

    function obtenerPropiedad(obj, llaves, valorDefecto = '') {
      for (let k of llaves) {
        if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
      }
      return valorDefecto;
    }

    /* ================= BÚSQUEDA ================= */
    function onBusquedaInput() {
      const q = document.getElementById('input-busqueda').value.trim();
      clearTimeout(tiempoDebounce);
      tiempoDebounce = setTimeout(() => buscarYCentrarArticulo(q), 200);
    }

    function buscarYCentrarArticulo(q) {
      if (!q) return;
      const query = q.toLowerCase();
      let idx = dbInventario.findIndex(item => String(obtenerPropiedad(item, ['articulo', 'Articulo'])).toLowerCase().includes(query));
      if (idx !== -1) irAlIndice(idx, true);
      else mostrarToast(`No encontrado`, "error");
    }

    function irAlIndice(index, suave = false) {
      const carrusel = document.getElementById('carrusel');
      const width = carrusel.offsetWidth + 16;
      indiceActual = index;
      carrusel.scrollTo({ left: index * width, behavior: suave ? 'smooth' : 'auto' });
      actualizarContadorPosicion();
      
      const cod = String(obtenerPropiedad(dbInventario[index], ['articulo', 'Articulo'])).trim();
      document.getElementById('dynamic-bg').style.backgroundImage = `url('https://intranet.emcomer.pe/INTER/TONW/FotosArticulos/${cod}_1.JPG')`;
    }

    /* ================= ZXING ESCÁNER (Mínimo y Rápido) ================= */
    async function iniciarEscaner() {
      const container = document.getElementById('scanner-container');
      const video = document.getElementById('scanner-video');
      container.classList.add('active');
      
      linternaEncendida = false;
      document.getElementById('btn-linterna').classList.remove('active');
      zoomActual = 1.0;
      document.getElementById('txt-zoom').innerText = "1.0x";
      escaneandoActivo = true;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        
        videoStreamActivo = stream;
        videoTrack = stream.getVideoTracks()[0];
        video.srcObject = stream;
        
        codeReader.decodeFromVideoDevice(null, video, (result, err) => {
          if (!escaneandoActivo) return;
          if (result) {
            const codigoFinal = result.text.replace(/\D/g, '');
            if (codigoFinal.length > 3) {
              escaneandoActivo = false;
              if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
              
              detenerEscaner();
              cambiarSeccion('view-buscar', document.querySelector('.nav-btn'), 'Buscar');
              document.getElementById('input-busqueda').value = codigoFinal;
              buscarYCentrarArticulo(codigoFinal);
              mostrarToast(`Escaneado`, "success");
            }
          }
        });
      } catch (err) {
        mostrarToast("Error de cámara", "error");
        detenerEscaner();
      }
    }

    function detenerEscaner() {
      escaneandoActivo = false;
      document.getElementById('scanner-container').classList.remove('active');
      codeReader.reset();
      if (videoStreamActivo) {
        videoStreamActivo.getTracks().forEach(track => track.stop());
        videoStreamActivo = null;
      }
    }

    async function toggleLinterna() {
      if (!videoTrack) return;
      linternaEncendida = !linternaEncendida;
      const btn = document.getElementById('btn-linterna');
      try {
        const capabilities = videoTrack.getCapabilities();
        if (capabilities.torch) {
          await videoTrack.applyConstraints({ advanced: [{ torch: linternaEncendida }] });
          btn.classList.toggle('active', linternaEncendida);
        } else {
          mostrarToast("Linterna no soportada", "error");
        }
      } catch (e) {}
    }

    async function ajustarZoom(cambio) {
      if (!videoTrack) return;
      zoomActual += cambio;
      try {
        const capabilities = videoTrack.getCapabilities();
        if (capabilities.zoom) {
          const min = capabilities.zoom.min || 1;
          const max = capabilities.zoom.max || 5;
          if (zoomActual < min) zoomActual = min;
          if (zoomActual > max) zoomActual = max;
          document.getElementById('txt-zoom').innerText = zoomActual.toFixed(1) + "x";
          await videoTrack.applyConstraints({ advanced: [{ zoom: zoomActual }] });
        }
      } catch (e) {}
    }

    /* ================= RENDERIZADO (Súper Ligero) ================= */
    function renderizarCarrusel() {
      const carrusel = document.getElementById('carrusel');
      if (dbInventario.length === 0) return;

      // HTML Mucho más ligero para que el celular no colapse
      carrusel.innerHTML = dbInventario.map((item) => {
        const cod = String(obtenerPropiedad(item, ['articulo', 'Articulo'])).trim();
        const stockBD = obtenerPropiedad(item, ['stock', 'Stock'], '0');
        const pPlanilla = obtenerPropiedad(item, ['pPlanilla', 'pplanilla'], '0.00');
        const selectivo = obtenerPropiedad(item, ['selectivo', 'Selectivo'], '');
        const tallaCantidadStr = obtenerPropiedad(item, ['tallaCantidad', 'tallacantidad'], '');
        
        const urlImagen = `https://intranet.emcomer.pe/INTER/TONW/FotosArticulos/${cod}_1.JPG`;
        const valorSelectivoVisual = (selectivo !== '' && selectivo !== null) ? selectivo : '--';

        // Formatear tallas
        let tallasHTML = '<div class="text-xs text-slate-400 text-center py-2">Sin tallas</div>';
        if (tallaCantidadStr) {
          let items = [];
          String(tallaCantidadStr).split(/[,;]+/).forEach(el => {
            if (el.includes('/')) {
              const [t, c] = el.split('/');
              items.push(`<div class="bg-slate-100 rounded-lg p-1 text-center flex-1"><div class="text-[9px] font-bold text-slate-500">T-${t.trim()}</div><div class="font-black text-slate-800">${c.trim()}</div></div>`);
            }
          });
          if (items.length > 0) tallasHTML = `<div class="flex gap-1 mt-2 overflow-x-auto no-scrollbar">${items.join('')}</div>`;
        }

        return `
          <div class="carrusel-card min-w-full h-[85%] bg-white rounded-3xl p-5 shadow-2xl flex flex-col justify-between">
            
            <!-- Imagen y Código -->
            <div class="flex flex-col items-center">
              <div class="w-full h-40 bg-slate-50 rounded-2xl flex items-center justify-center p-2 mb-3">
                <img src="${urlImagen}" onerror="this.src='https://via.placeholder.com/150?text=No+Img'" class="max-h-full max-w-full object-contain drop-shadow-md">
              </div>
              <h2 class="text-3xl font-black text-slate-900 tracking-tighter">${cod}</h2>
            </div>

            <!-- Detalles -->
            <div class="mt-2">
              <div class="flex justify-between items-center bg-slate-50 rounded-xl p-2 mb-2">
                <div class="text-center flex-1">
                  <div class="text-[9px] font-bold text-slate-400 uppercase">Stock</div>
                  <div class="font-black text-lg text-slate-800">${stockBD}</div>
                </div>
                <div class="w-px h-6 bg-slate-200"></div>
                <div class="text-center flex-1">
                  <div class="text-[9px] font-bold text-slate-400 uppercase">Planilla</div>
                  <div class="font-black text-lg text-slate-800">S/ ${pPlanilla}</div>
                </div>
              </div>
              ${tallasHTML}
            </div>

            <!-- Selectivo -->
            <div class="mt-2 bg-slate-50 p-2 rounded-xl border border-slate-200 flex items-center justify-between">
              <div class="text-xs font-black text-slate-500 uppercase">Conteo</div>
              ${modoActual === 'selectivo' ? `
                <div class="flex gap-1">
                  <input type="text" inputmode="numeric" id="input-sel-${cod}" value="${selectivo}" placeholder="0" class="w-16 px-2 py-1 bg-white border border-amber-400 rounded-lg text-center font-black text-amber-900">
                  <button onclick="guardarSelectivo('${cod}')" class="bg-amber-500 text-white w-8 h-8 rounded-lg flex items-center justify-center"><i class="fa-solid fa-check text-xs"></i></button>
                </div>
              ` : `
                <div class="text-xl font-black text-bata-red">${valorSelectivoVisual}</div>
              `}
            </div>
          </div>
        `;
      }).join('');
      
      setTimeout(() => irAlIndice(indiceActual, false), 50);
    }

    function actualizarContadorPosicion() {
      document.getElementById('txt-posicion').innerText = `${indiceActual + 1} de ${dbInventario.length}`;
    }

    function toggleModoSelectivo() {
      modoActual = (modoActual === 'consulta') ? 'selectivo' : 'consulta';
      const btn = document.getElementById('btn-toggle-selectivo');
      if (modoActual === 'selectivo') {
        btn.classList.add('text-amber-400', 'bg-amber-500/20', 'border-amber-500');
      } else {
        btn.classList.remove('text-amber-400', 'bg-amber-500/20', 'border-amber-500');
      }
      renderizarCarrusel();
    }

    function guardarSelectivo(codigo) {
      const input = document.getElementById(`input-sel-${codigo}`);
      const valor = input.value.trim();
      if (!/^\d+$/.test(valor)) { mostrarToast("Solo números", "error"); return; }
      
      guardandoBloqueo = true;
      const btn = input.nextElementSibling;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i>';

      fetch(URL_APPS_SCRIPT, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'actualizarSelectivo', articulo: codigo, selectivo: valor })
      }).then(() => {
        const obj = dbInventario.find(i => String(obtenerPropiedad(i, ['articulo', 'Articulo'])).trim() === String(codigo).trim());
        if (obj) obj.selectivo = valor;
        mostrarToast(`Guardado`, "success");
      }).finally(() => {
        guardandoBloqueo = false;
        btn.innerHTML = '<i class="fa-solid fa-check text-xs"></i>';
      });
    }

    function mostrarToast(mensaje, tipo) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      document.getElementById('toast-msg').innerText = mensaje;
      
      icon.className = tipo === 'error' ? "fa-solid fa-circle-xmark text-red-500" : "fa-solid fa-circle-check text-emerald-500";
      
      toast.classList.remove('-translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 2500);
    }
  </script>
</body>
</html>
