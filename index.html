<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bata 1 | Control de Stock</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Html5Qrcode Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            bata: { red: '#E31E24', dark: '#111827', gray: '#F3F4F6' }
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'nav': '0 -4px 20px -2px rgba(0, 0, 0, 0.05)'
          }
        }
      }
    }
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .carrusel-container {
      scroll-snap-type: x mandatory;
      touch-action: pan-x;
    }
    .carrusel-card {
      scroll-snap-align: center;
      scroll-snap-stop: always;
    }
    
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* SPA OPTIMIZADO: Usamos opacity y z-index para no colapsar el navegador */
    .app-section {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
      display: flex;
      flex-direction: column;
      padding-bottom: 65px; /* Espacio para el menú */
    }
    .app-section.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    /* ====== ARREGLO VISUAL DEL ESCÁNER ====== */
    /* Forzar que el video ocupe TODA la pantalla sin importar lo que diga la librería */
    #reader { 
      width: 100vw !important; 
      height: 100vh !important; 
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    #reader video { 
      width: 100vw !important; 
      height: 100vh !important; 
      object-fit: cover !important; 
    }
    #reader__scan_region { 
      background: transparent !important; 
    }

    /* Overlay del escáner */
    .scanner-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .scanner-window {
      width: 85%;
      max-width: 320px;
      height: 180px;
      background: transparent;
      box-shadow: 0 0 0 100vmax rgba(0,0,0,0.6);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }
    /* Esquinas rojas del escáner */
    .scanner-window::before { content: ''; position: absolute; top: 0; left: 0; width: 30px; height: 30px; border-color: #E31E24; border-style: solid; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
    .scanner-window::after { content: ''; position: absolute; bottom: 0; right: 0; width: 30px; height: 30px; border-color: #E31E24; border-style: solid; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }
    .corner-tr { position: absolute; top: 0; right: 0; width: 30px; height: 30px; border-color: #E31E24; border-style: solid; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
    .corner-bl { position: absolute; bottom: 0; left: 0; width: 30px; height: 30px; border-color: #E31E24; border-style: solid; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
    
    /* Láser */
    .laser {
      position: absolute; top: 0; left: 0; right: 0; height: 2px; background: #E31E24; box-shadow: 0 0 10px #E31E24;
      animation: scan 2s infinite linear;
    }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(180px); opacity: 0; } }

    .scanner-btn {
      width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
      color: white; display: flex; align-items: center; justify-content: center; font-size: 20px;
      border: 1px solid rgba(255,255,255,0.3); transition: all 0.2s; pointer-events: auto;
    }
    .scanner-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.4); }
    .scanner-btn.active { background: #E31E24; border-color: #E31E24; box-shadow: 0 0 15px rgba(227,30,36,0.5); }
  </style>
</head>
<body class="bg-slate-100 font-sans h-[100dvh] w-screen overflow-hidden text-slate-800 flex flex-col justify-center items-center antialiased">

  <div class="w-full max-w-md h-full bg-slate-50 flex flex-col relative shadow-2xl overflow-hidden">

    <!-- CABECERA -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex-shrink-0 z-40 sticky top-0">
      <div class="flex items-center justify-between gap-2">
        <div>
          <h1 id="header-title" class="font-black text-slate-900 text-base leading-tight tracking-tight">Buscador</h1>
          <p id="header-subtitle" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Bata 1</p>
        </div>
        <button onclick="sincronizarDatos()" class="w-8 h-8 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-600 active:scale-95 transition-transform">
          <i id="icon-sync" class="fa-solid fa-rotate text-sm"></i>
        </button>
      </div>
    </header>

    <!-- CONTENEDOR DE VISTAS -->
    <main class="w-full flex-1 relative overflow-hidden">

      <!-- ================= VISTA 1: BUSCADOR ================= -->
      <section id="view-buscar" class="app-section active px-4 py-3 gap-3">
        
        <!-- Barra de Búsqueda -->
        <div class="flex-shrink-0 z-30 space-y-2 mt-1">
          <div class="relative flex items-center bg-white rounded-2xl shadow-soft border border-slate-200 p-1">
            <i class="fa-solid fa-search text-slate-400 ml-3 text-sm"></i>
            <input type="text" inputmode="numeric" id="input-busqueda" placeholder="Tipea o dicta el código..." 
                   class="flex-1 bg-transparent px-3 py-2.5 text-sm font-bold text-slate-900 focus:outline-none placeholder-slate-400"
                   oninput="onBusquedaInput()">
            
            <div class="flex items-center gap-1 pr-1">
              <button id="btn-limpiar" onclick="limpiarBusqueda()" class="hidden w-8 h-8 rounded-xl text-slate-400 hover:text-slate-600 flex items-center justify-center">
                <i class="fa-solid fa-circle-xmark"></i>
              </button>
              <button onclick="activarBusquedaVoz()" id="btn-voz" class="w-10 h-10 rounded-xl bg-slate-50 hover:bg-slate-100 flex items-center justify-center text-slate-600 transition-all border border-slate-100 relative overflow-hidden">
                <i id="icon-voz" class="fa-solid fa-microphone text-base z-10"></i>
              </button>
              <!-- Icono cambiado a código de barras como pediste -->
              <button onclick="abrirCamaraEscaner()" class="w-10 h-10 rounded-xl bg-bata-red text-white flex items-center justify-center shadow-md active:scale-95 transition-transform">
                <i class="fa-solid fa-barcode text-lg"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-[11px] font-bold px-1">
            <span id="txt-posicion" class="text-slate-500">Cargando...</span>
            <button onclick="toggleModoSelectivo()" id="btn-toggle-selectivo" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 shadow-sm transition">
              <i class="fa-solid fa-pen-to-square"></i> 
              <span>Modo Conteo</span>
            </button>
          </div>
        </div>

        <!-- Carrusel de Productos -->
        <div class="relative flex-1 flex min-h-0 -mx-2 px-2">
          <div id="carrusel" class="carrusel-container flex overflow-x-auto no-scrollbar w-full items-stretch gap-4 pb-2">
            <!-- El contenido se inyecta vía JS -->
          </div>
        </div>
      </section>

      <!-- ================= OTRAS VISTAS ================= -->
      <section id="view-movimientos" class="app-section px-4 py-6">
        <div class="flex flex-col items-center justify-center h-full text-center space-y-3">
          <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-boxes-packing"></i></div>
          <h2 class="text-lg font-black text-slate-800">Recepción / Salida</h2>
          <p class="text-sm text-slate-500 max-w-[250px]">Módulo para registrar ingreso o bajas de mercadería.</p>
        </div>
      </section>

      <section id="view-reportes" class="app-section px-4 py-6">
        <div class="flex flex-col items-center justify-center h-full text-center space-y-3">
          <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-chart-line"></i></div>
          <h2 class="text-lg font-black text-slate-800">Reportes</h2>
          <p class="text-sm text-slate-500 max-w-[250px]">Métricas de stock y ventas.</p>
        </div>
      </section>

      <section id="view-planilla" class="app-section px-4 py-6">
        <div class="flex flex-col items-center justify-center h-full text-center space-y-3">
          <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-file-invoice-dollar"></i></div>
          <h2 class="text-lg font-black text-slate-800">Planilla</h2>
          <p class="text-sm text-slate-500 max-w-[250px]">Consulta de precios y ventas acumuladas.</p>
        </div>
      </section>

      <section id="view-historial" class="app-section px-4 py-6">
        <div class="flex flex-col items-center justify-center h-full text-center space-y-3">
          <div class="w-16 h-16 bg-slate-200 text-slate-600 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-clock-rotate-left"></i></div>
          <h2 class="text-lg font-black text-slate-800">Historial</h2>
          <p class="text-sm text-slate-500 max-w-[250px]">Registro de búsquedas recientes.</p>
        </div>
      </section>

    </main>

    <!-- MENÚ INFERIOR -->
    <nav class="absolute bottom-0 w-full bg-white border-t border-slate-200 px-1 py-1.5 flex items-center justify-around z-40 shadow-nav rounded-t-2xl">
      <button onclick="cambiarSeccion('view-buscar', this, 'Buscador', 'Bata 1')" class="nav-btn flex flex-col items-center justify-center w-16 h-12 rounded-xl text-bata-red">
        <i class="fa-solid fa-magnifying-glass text-lg mb-1"></i><span class="text-[9px] font-bold">Buscar</span>
      </button>
      <button onclick="cambiarSeccion('view-movimientos', this, 'Movimientos', 'Recepción / Salida')" class="nav-btn flex flex-col items-center justify-center w-16 h-12 rounded-xl text-slate-400">
        <i class="fa-solid fa-boxes-packing text-lg mb-1"></i><span class="text-[9px] font-bold">Movs.</span>
      </button>
      <button onclick="cambiarSeccion('view-reportes', this, 'Reportes', 'Métricas')" class="nav-btn flex flex-col items-center justify-center w-16 h-12 rounded-xl text-slate-400">
        <i class="fa-solid fa-chart-line text-lg mb-1"></i><span class="text-[9px] font-bold">Reportes</span>
      </button>
      <button onclick="cambiarSeccion('view-planilla', this, 'Planilla', 'Precios')" class="nav-btn flex flex-col items-center justify-center w-16 h-12 rounded-xl text-slate-400">
        <i class="fa-solid fa-file-invoice-dollar text-lg mb-1"></i><span class="text-[9px] font-bold">Planilla</span>
      </button>
      <button onclick="cambiarSeccion('view-historial', this, 'Historial', 'Actividad')" class="nav-btn flex flex-col items-center justify-center w-16 h-12 rounded-xl text-slate-400">
        <i class="fa-solid fa-clock-rotate-left text-lg mb-1"></i><span class="text-[9px] font-bold">Historial</span>
      </button>
    </nav>

    <!-- MODAL ESCÁNER OPTIMIZADO -->
    <div id="modal-escaner" class="fixed inset-0 bg-black z-50 hidden">
      <div id="reader"></div>
      
      <!-- Overlay UI -->
      <div class="scanner-overlay">
        <!-- Botones Superiores -->
        <div class="absolute top-0 left-0 right-0 p-4 pt-10 flex justify-between items-center z-50 bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
          <button onclick="cerrarCamaraEscaner()" class="scanner-btn"><i class="fa-solid fa-xmark"></i></button>
          <span class="text-white font-black text-sm tracking-wide bg-black/40 px-3 py-1 rounded-full">ESCÁNER EAN-13</span>
          <button onclick="toggleLinterna()" id="btn-linterna" class="scanner-btn"><i class="fa-solid fa-bolt"></i></button>
        </div>

        <!-- Ventana de Enfoque -->
        <div class="scanner-window">
          <div class="corner-tr"></div>
          <div class="corner-bl"></div>
          <div class="laser"></div>
        </div>
        <p class="text-white/80 text-xs font-bold mt-6 tracking-wide bg-black/40 px-4 py-1.5 rounded-full">Enfoca el código de barras</p>

        <!-- Controles Zoom -->
        <div class="absolute bottom-10 left-0 right-0 flex justify-center items-center gap-6 z-50 pointer-events-none">
          <button onclick="ajustarZoom(-0.5)" class="scanner-btn"><i class="fa-solid fa-minus"></i></button>
          <div class="text-white font-black text-lg bg-black/40 px-4 py-2 rounded-full border border-white/20" id="txt-zoom">1.0x</div>
          <button onclick="ajustarZoom(0.5)" class="scanner-btn"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-bold z-[60]">
      <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
      <span id="toast-msg">Mensaje</span>
    </div>

  </div>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx-pUdg1wOtaxE_V27ZO6-zLAh7lkge8GHKfURNDF_HPim4WGSktwfz4jKyHIEGa81P0A/exec";

    let dbInventario = [];
    let modoActual = 'consulta'; 
    let indiceActual = 0;
    let guardandoBloqueo = false;
    let html5QrCodeScanner = null;
    let tiempoDebounce;
    let linternaEncendida = false;
    let zoomActual = 1.0;
    
    let ultimoShake = 0;

    window.onload = function() {
      sincronizarDatos();
      solicitarPermisoSensoresYIniciar();

      const carrusel = document.getElementById('carrusel');
      carrusel.addEventListener('scroll', () => {
        if (guardandoBloqueo) return;
        const width = carrusel.offsetWidth + 16;
        const nuevoIndice = Math.round(carrusel.scrollLeft / width);
        if (nuevoIndice !== indiceActual && dbInventario[nuevoIndice]) {
          indiceActual = nuevoIndice;
          actualizarContadorPosicion();
        }
      });
    };

    /* ================= SHAKE SENSOR (SACUDIDA) ================= */
    function solicitarPermisoSensoresYIniciar() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        document.body.addEventListener('click', async function pedirPermiso() {
          try {
            if (await DeviceMotionEvent.requestPermission() === 'granted') {
              window.addEventListener('devicemotion', detectarShake, false);
            }
          } catch (e) {}
          document.body.removeEventListener('click', pedirPermiso);
        }, { once: true });
      } else if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', detectarShake, false);
      }
    }

    function detectarShake(e) {
      // Evitar abrir el escáner si ya está abierto
      if (!document.getElementById('modal-escaner').classList.contains('hidden')) return;

      const ahora = Date.now();
      // Cooldown de 3 segundos para no abrir mil veces
      if ((ahora - ultimoShake) < 3000) return; 

      const acc = e.accelerationIncludingGravity;
      if (!acc) return;

      // Sacudida fuerte (Fuerza > 35)
      const fuerza = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
      if (fuerza > 35) { 
        ultimoShake = ahora;
        if (navigator.vibrate) navigator.vibrate(50);
        abrirCamaraEscaner();
      }
    }

    /* ================= NAVEGACIÓN RÁPIDA ================= */
    function cambiarSeccion(viewId, btn, titulo, subtitulo) {
      document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      
      document.getElementById('header-title').innerText = titulo;
      document.getElementById('header-subtitle').innerText = subtitulo;

      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('text-bata-red');
        b.classList.add('text-slate-400');
      });
      if (btn) {
        btn.classList.remove('text-slate-400');
        btn.classList.add('text-bata-red');
      }
    }

    /* ================= DATOS ================= */
    function sincronizarDatos() {
      const iconSync = document.getElementById('icon-sync');
      iconSync.classList.add('fa-spin');

      fetch(`${URL_APPS_SCRIPT}?action=obtenerInventario&t=${Date.now()}`)
        .then(res => res.json())
        .then(data => {
          dbInventario = data;
          renderizarCarrusel();
        })
        .catch(err => mostrarToast("Error de conexión", "error"))
        .finally(() => iconSync.classList.remove('fa-spin'));
    }

    function obtenerPropiedad(obj, llaves, valorDefecto = '') {
      for (let k of llaves) {
        if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
      }
      return valorDefecto;
    }

    /* ================= BÚSQUEDA Y VOZ ================= */
    function onBusquedaInput() {
      const q = document.getElementById('input-busqueda').value.trim();
      document.getElementById('btn-limpiar').classList.toggle('hidden', q.length === 0);
      clearTimeout(tiempoDebounce);
      tiempoDebounce = setTimeout(() => buscarYCentrarArticulo(q), 200);
    }

    function buscarYCentrarArticulo(q) {
      if (!q) return;
      const query = q.toLowerCase();
      let idx = dbInventario.findIndex(item => String(obtenerPropiedad(item, ['articulo', 'Articulo'])).toLowerCase().includes(query));
      if (idx !== -1) irAlIndice(idx, true);
      else mostrarToast(`Código "${q}" no encontrado`, "error");
    }

    function irAlIndice(index, suave = false) {
      const carrusel = document.getElementById('carrusel');
      const width = carrusel.offsetWidth + 16;
      indiceActual = index;
      carrusel.scrollTo({ left: index * width, behavior: suave ? 'smooth' : 'auto' });
      actualizarContadorPosicion();
    }

    function limpiarBusqueda() {
      document.getElementById('input-busqueda').value = '';
      document.getElementById('btn-limpiar').classList.add('hidden');
    }

    function activarBusquedaVoz() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { mostrarToast("Voz no soportada", "error"); return; }
      
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.interimResults = false;
      
      const btnVoz = document.getElementById('btn-voz');
      btnVoz.classList.add('bg-red-100', 'border-red-300');
      btnVoz.classList.remove('bg-slate-50');
      document.getElementById('icon-voz').className = "fa-solid fa-microphone-lines text-bata-red text-base fa-bounce z-10";
      
      mostrarToast("Escuchando...", "info");
      recognition.start();

      recognition.onresult = (event) => {
        let texto = event.results[0][0].transcript.toLowerCase();
        const mapa = {'cero':'0','uno':'1','dos':'2','tres':'3','cuatro':'4','cinco':'5','seis':'6','siete':'7','ocho':'8','nueve':'9','diez':'10'};
        let soloNumeros = texto.split(' ').map(p => mapa[p] || p).join('').replace(/\D/g, '');
        
        if (soloNumeros) {
          document.getElementById('input-busqueda').value = soloNumeros;
          buscarYCentrarArticulo(soloNumeros);
        } else {
          mostrarToast("No se detectaron números", "error");
        }
      };

      recognition.onend = () => {
        btnVoz.classList.remove('bg-red-100', 'border-red-300');
        btnVoz.classList.add('bg-slate-50');
        document.getElementById('icon-voz').className = "fa-solid fa-microphone text-base z-10";
      };
    }

    /* ================= ESCÁNER ULTRA RÁPIDO ================= */
    function abrirCamaraEscaner() {
      document.getElementById('modal-escaner').classList.remove('hidden');
      
      if (!html5QrCodeScanner) {
        html5QrCodeScanner = new Html5Qrcode("reader");
      }

      // Configuración optimizada: API nativa de barras y ancho calculado
      const size = Math.min(window.innerWidth, window.innerHeight) * 0.7;
      
      html5QrCodeScanner.start(
        { facingMode: "environment" }, 
        { 
          fps: 10, 
          qrbox: { width: size, height: size * 0.6 }, // Enfoque rectangular para EAN-13
          experimentalFeatures: { useBarCodeDetectorIfSupported: true } // ACELERADOR NATIVO
        }, 
        (decodedText) => {
          const codigoFinal = decodedText.replace(/\D/g, '');
          cambiarSeccion('view-buscar', document.querySelector('.nav-btn'), 'Buscador', 'Bata 1');
          document.getElementById('input-busqueda').value = codigoFinal;
          buscarYCentrarArticulo(codigoFinal);
          cerrarCamaraEscaner();
          if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
          mostrarToast(`Escaneado: ${codigoFinal}`, "success");
        },
        () => {} 
      ).then(() => {
        aplicarZoom();
      }).catch(err => {
        mostrarToast("Error al iniciar cámara", "error");
        cerrarCamaraEscaner();
      });
    }

    function cerrarCamaraEscaner() {
      if (html5QrCodeScanner) {
        html5QrCodeScanner.stop().then(() => {
          document.getElementById('modal-escaner').classList.add('hidden');
          linternaEncendida = false;
          document.getElementById('btn-linterna').classList.remove('active');
          zoomActual = 1.0;
          document.getElementById('txt-zoom').innerText = "1.0x";
        }).catch(() => {});
      }
    }

    function toggleLinterna() {
      linternaEncendida = !linternaEncendida;
      const btn = document.getElementById('btn-linterna');
      if (html5QrCodeScanner) {
        try {
          const track = html5QrCodeScanner.getRunningTrackCameraCapabilities().torchFeature();
          if (track) {
            track.apply(linternaEncendida);
            btn.classList.toggle('active', linternaEncendida);
          } else {
            mostrarToast("Linterna no soportada", "error");
            linternaEncendida = false;
          }
        } catch(e) {}
      }
    }

    function ajustarZoom(cambio) {
      zoomActual += cambio;
      if (zoomActual < 1.0) zoomActual = 1.0;
      if (zoomActual > 4.0) zoomActual = 4.0;
      document.getElementById('txt-zoom').innerText = zoomActual.toFixed(1) + "x";
      aplicarZoom();
    }

    function aplicarZoom() {
      if (html5QrCodeScanner) {
        try {
          const caps = html5QrCodeScanner.getRunningTrackCameraCapabilities();
          const zoomCap = caps.zoomFeature();
          if (zoomCap) zoomCap.apply(zoomActual);
        } catch(e) {}
      }
    }

    /* ================= RENDERIZADO ================= */
    function generarMatrizTallas(cadenaTallas, stockTotal) {
      if (!cadenaTallas) return `<div class="text-[11px] text-slate-400 text-center py-3 bg-slate-50/50 border border-slate-100 rounded-xl">Sin desglose</div>`;
      const pares = [];
      String(cadenaTallas).split(/[,;]+/).forEach(el => {
        const limpio = el.trim();
        if (limpio.includes('/')) {
          const [t, c] = limpio.split('/');
          if (t && c) pares.push({ talla: t.trim(), cant: c.trim() });
        }
      });
      if (pares.length === 0) return `<div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-center text-sm font-black text-slate-700">${cadenaTallas}</div>`;

      return `
        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
          <div class="flex items-center justify-between bg-slate-50 border-b border-slate-200 px-3 py-2">
            <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest">Tallas</span>
            <span class="text-[11px] font-black text-emerald-700 bg-emerald-100/80 px-2 py-0.5 rounded-md border border-emerald-200">Total: ${stockTotal} pares</span>
          </div>
          <div class="p-2 grid grid-cols-4 gap-2">
            ${pares.map(p => `
              <div class="flex flex-col items-center justify-center bg-slate-50/50 border border-slate-100 rounded-xl py-1.5 shadow-sm">
                <span class="text-[10px] font-bold text-slate-400 mb-0.5">T-${p.talla}</span>
                <span class="text-sm font-black text-slate-800">${p.cant}</span>
              </div>
            `).join('')}
          </div>
        </div>`;
    }

    function renderizarCarrusel() {
      const carrusel = document.getElementById('carrusel');
      if (dbInventario.length === 0) return;

      carrusel.innerHTML = dbInventario.map((item) => {
        const cod = String(obtenerPropiedad(item, ['articulo', 'Articulo'])).trim();
        const stockBD = obtenerPropiedad(item, ['stock', 'Stock'], '0');
        const pPlanilla = obtenerPropiedad(item, ['pPlanilla', 'pplanilla'], '0.00');
        const vtaAcc = obtenerPropiedad(item, ['vtaAcctalla', 'vtaAcc'], '0');
        const categoria = obtenerPropiedad(item, ['categoria', 'Categoria'], 'CALZADO');
        const calidad = obtenerPropiedad(item, ['calidad', 'Calidad'], '1');
        const antiguedad = obtenerPropiedad(item, ['antiguedad', 'Antiguedad'], '');
        const selectivo = obtenerPropiedad(item, ['selectivo', 'Selectivo'], '');
        const tallaCantidadStr = obtenerPropiedad(item, ['tallaCantidad', 'tallacantidad'], '');
        const urlImagen = `https://intranet.emcomer.pe/INTER/TONW/FotosArticulos/${cod}_1.JPG`;

        const valorSelectivoVisual = (selectivo !== '' && selectivo !== null && selectivo !== undefined) ? selectivo : '--';

        return `
          <div class="carrusel-card min-w-full bg-white rounded-3xl border border-slate-200 p-4 shadow-soft flex flex-col gap-3 h-full">
            <div class="flex items-start justify-between gap-2">
              <div class="flex flex-wrap gap-1.5">
                <span class="bg-slate-100 text-slate-600 border border-slate-200 text-[10px] font-bold px-2 py-0.5 rounded-lg">Calidad: ${calidad}</span>
                ${antiguedad ? `<span class="bg-slate-800 text-white text-[10px] font-bold px-2 py-0.5 rounded-lg shadow-sm"><i class="fa-regular fa-clock text-[9px] mr-1"></i>${antiguedad}</span>` : ''}
              </div>
              <span class="bg-bata-dark text-white text-[10px] font-bold px-2.5 py-0.5 rounded-lg uppercase tracking-wider shadow-sm">${categoria}</span>
            </div>
            <div class="relative w-full h-[160px] shrink-0 bg-slate-50 rounded-2xl border border-slate-100/50 flex items-center justify-center p-4">
              <img src="${urlImagen}" onerror="this.src='https://via.placeholder.com/220x220/f8fafc/94a3b8?text=SIN+IMAGEN';" class="max-h-full max-w-full object-contain drop-shadow-md">
            </div>
            <div class="flex items-end justify-between px-1">
              <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-0.5">Código</span>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight leading-none">${cod}</h2>
              </div>
              <div class="flex items-center gap-3">
                <div class="text-right">
                  <span class="text-[10px] font-bold text-slate-400 block mb-0.5">P. Planilla</span>
                  <span class="font-black text-slate-800 text-sm">S/ ${pPlanilla}</span>
                </div>
                <div class="text-right bg-blue-50/80 border border-blue-100/80 px-2.5 py-1 rounded-xl">
                  <span class="text-[9px] font-black text-blue-500 block uppercase tracking-wide">Vta. Acc.</span>
                  <span class="font-black text-blue-900 text-sm leading-none">${vtaAcc}</span>
                </div>
              </div>
            </div>
            ${generarMatrizTallas(tallaCantidadStr, stockBD)}
            <div class="mt-auto bg-slate-50 p-2.5 rounded-2xl border border-slate-200 flex items-center justify-between gap-3 ${modoActual === 'selectivo' ? 'border-amber-300 bg-amber-50/50' : ''}">
              <div class="text-center px-2">
                <span class="block text-[9px] font-black uppercase text-slate-400 tracking-wider mb-0.5">Stock BD</span>
                <span class="text-lg font-black text-slate-900 leading-none">${stockBD}</span>
              </div>
              <div class="h-8 w-px bg-slate-200"></div>
              ${modoActual === 'selectivo' ? `
                <div class="flex items-center gap-2 flex-1 justify-end">
                  <input type="text" inputmode="numeric" id="input-sel-${cod}" value="${selectivo}" placeholder="0" class="w-16 px-2 py-1.5 bg-white border-2 border-amber-400 rounded-xl text-center font-black text-base text-amber-900 focus:outline-none focus:ring-2 focus:ring-amber-400/30 shadow-sm">
                  <button onclick="guardarSelectivo('${cod}')" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold w-9 h-9 rounded-xl transition-all shadow-md flex items-center justify-center"><i class="fa-solid fa-check text-sm"></i></button>
                </div>
              ` : `
                <div class="text-center px-4 flex items-center gap-3">
                  <div>
                    <span class="block text-[9px] font-black uppercase text-slate-400 tracking-wider mb-0.5">Selectivo</span>
                    <span class="text-lg font-black text-bata-red leading-none">${valorSelectivoVisual}</span>
                  </div>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
      setTimeout(() => irAlIndice(indiceActual, false), 50);
    }

    function actualizarContadorPosicion() {
      const txtPos = document.getElementById('txt-posicion');
      if (dbInventario.length === 0) txtPos.innerText = `Sin datos`;
      else txtPos.innerText = `Artículo ${indiceActual + 1} de ${dbInventario.length}`;
    }

    function toggleModoSelectivo() {
      modoActual = (modoActual === 'consulta') ? 'selectivo' : 'consulta';
      const btn = document.getElementById('btn-toggle-selectivo');
      
      if (modoActual === 'selectivo') {
        btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-amber-300 bg-amber-100 text-amber-700 shadow-sm transition font-black";
        btn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> <span>Editando...</span>';
      } else {
        btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 shadow-sm transition";
        btn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> <span>Modo Conteo</span>';
      }
      
      renderizarCarrusel();
    }

    function guardarSelectivo(codigo) {
      const input = document.getElementById(`input-sel-${codigo}`);
      const valorIngresado = input.value.trim();
      if (!/^\d+$/.test(valorIngresado)) { mostrarToast("Solo números", "error"); return; }

      const btn = input.nextElementSibling;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm"></i>';
      guardandoBloqueo = true;

      fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'actualizarSelectivo', articulo: codigo, selectivo: valorIngresado })
      })
      .then(() => {
        const obj = dbInventario.find(i => String(obtenerPropiedad(i, ['articulo', 'Articulo'])).trim() === String(codigo).trim());
        if (obj) obj.selectivo = valorIngresado;
        mostrarToast(`Guardado: ${valorIngresado}`, "success");
      })
      .catch(() => mostrarToast("Error de red", "error"))
      .finally(() => {
        guardandoBloqueo = false;
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check text-sm"></i>';
      });
    }

    function mostrarToast(mensaje, tipo = "success") {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-msg');
      const icon = document.getElementById('toast-icon');

      msg.innerText = mensaje;
      if (tipo === "success") icon.className = "fa-solid fa-circle-check text-emerald-400 text-base";
      else if (tipo === "error") icon.className = "fa-solid fa-circle-xmark text-rose-400 text-base";
      else icon.className = "fa-solid fa-circle-info text-sky-400 text-base";

      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 2500);
    }
  </script>
</body>
</html>
